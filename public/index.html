<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Projetos — Software Seguro</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>🔐 Gestão de Projetos — Software Seguro</h1>
    <nav id="nav" class="hidden">
      <button onclick="showView('dashboard')">Dashboard</button>
      <button onclick="showView('projects')">Projetos</button>
      <button onclick="showView('tasks')">Tarefas</button>
      <button onclick="showView('users')" id="navUsers" class="hidden">Usuários</button>
      <button onclick="showView('logs')" id="navLogs" class="hidden">Logs</button>
      <button onclick="logout()" class="danger">Sair</button>
    </nav>
  </header>

  <main>
    <!-- AUTH VIEW -->
    <section id="view-auth" class="view active">
      <div class="card">
        <h2>Acesso ao Sistema</h2>
        <div class="tabs">
          <button onclick="switchTab('login')" id="tabLogin" class="active">Entrar</button>
          <button onclick="switchTab('register')" id="tabRegister">Cadastrar</button>
        </div>
        <div id="formLogin">
          <input id="loginEmail" type="email" placeholder="Email" />
          <input id="loginPassword" type="password" placeholder="Senha" />
          <button onclick="login()">Entrar</button>
        </div>
        <div id="formRegister" class="hidden">
          <input id="regName" placeholder="Nome completo" />
          <input id="regEmail" type="email" placeholder="Email" />
          <input id="regPassword" type="password" placeholder="Senha (mín. 8 caracteres)" />
          <button onclick="register()">Cadastrar</button>
        </div>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="view-dashboard" class="view hidden">
      <h2>Painel Principal</h2>
      <p>Bem-vindo, <strong id="dashUser"></strong> (<span id="dashRole"></span>)</p>
      <div class="stats">
        <div class="stat-card"><h3>Projetos</h3><p id="statProjects">0</p></div>
        <div class="stat-card"><h3>Tarefas</h3><p id="statTasks">0</p></div>
        <div class="stat-card"><h3>Pendentes</h3><p id="statPending">0</p></div>
        <div class="stat-card"><h3>Em Andamento</h3><p id="statProgress">0</p></div>
        <div class="stat-card"><h3>Concluídas</h3><p id="statDone">0</p></div>
        <div class="stat-card" id="statUsersCard" class="hidden"><h3>Usuários</h3><p id="statUsers">0</p></div>
      </div>
      <button onclick="loadDashboard()">Atualizar</button>
    </section>

    <!-- PROJECTS VIEW -->
    <section id="view-projects" class="view hidden">
      <h2>Projetos</h2>
      <div class="card">
        <h3>Novo Projeto</h3>
        <input id="projName" placeholder="Nome do projeto" />
        <textarea id="projDesc" placeholder="Descrição"></textarea>
        <button onclick="createProject()">Criar Projeto</button>
        <p id="projMsg" class="msg"></p>
      </div>
      <div id="projectsList"></div>
    </section>

    <!-- TASKS VIEW -->
    <section id="view-tasks" class="view hidden">
      <h2>Tarefas</h2>
      <div class="card">
        <h3>Nova Tarefa</h3>
        <label>Projeto:</label>
        <select id="taskProject"></select>
        <input id="taskTitle" placeholder="Título da tarefa" />
        <textarea id="taskDesc" placeholder="Descrição"></textarea>
        <input id="taskAssign" type="number" placeholder="ID do responsável (opcional)" />
        <button onclick="createTask()">Criar Tarefa</button>
        <p id="taskMsg" class="msg"></p>
      </div>
      <div>
        <label>Filtrar por projeto:</label>
        <select id="filterProject" onchange="loadTasks()"></select>
      </div>
      <div id="tasksList"></div>
    </section>

    <!-- USERS VIEW -->
    <section id="view-users" class="view hidden">
      <h2>Gerenciamento de Usuários</h2>
      <div class="card">
        <h3>Novo Usuário</h3>
        <input id="newUserName" placeholder="Nome" />
        <input id="newUserEmail" type="email" placeholder="Email" />
        <input id="newUserPassword" type="password" placeholder="Senha" />
        <select id="newUserRole">
          <option value="USER">USER</option>
          <option value="MANAGER">MANAGER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <button onclick="createUser()">Cadastrar Usuário</button>
        <p id="userMsg" class="msg"></p>
      </div>
      <div id="usersList"></div>
      <button onclick="loadUsers()" style="margin-top:1rem">Atualizar Lista</button>
    </section>

    <!-- LOGS VIEW -->
    <section id="view-logs" class="view hidden">
      <h2>Logs de Auditoria</h2>
      <button onclick="loadLogs()">Atualizar</button>
      <div id="logsList" class="log-box"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
